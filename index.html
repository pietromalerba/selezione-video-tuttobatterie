<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Selezione video AI - Tuttobatterie</title>
  <style>
    :root {
      --bg: #f6f7f9;
      --panel: #ffffff;
      --text: #171a1f;
      --muted: #6a7280;
      --border: #dfe3ea;
      --ok: #11834f;
      --ok-soft: #e6f5ee;
      --no: #b42318;
      --no-soft: #fae8e6;
      --accent: #1d4ed8;
      --shadow: 0 10px 28px rgba(17, 24, 39, 0.08);
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      line-height: 1.45;
    }

    button {
      font: inherit;
    }

    .page {
      width: min(1180px, calc(100% - 32px));
      margin: 0 auto;
      padding: 28px 0 56px;
    }

    .topbar {
      position: sticky;
      top: 0;
      z-index: 10;
      margin: 0 -16px 26px;
      padding: 14px 16px;
      background: rgba(246, 247, 249, 0.92);
      backdrop-filter: blur(14px);
      border-bottom: 1px solid rgba(223, 227, 234, 0.9);
    }

    .topbar-inner {
      width: min(1180px, 100%);
      margin: 0 auto;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
    }

    .brand h1 {
      margin: 0;
      font-size: clamp(1rem, 2.2vw, 1.45rem);
      line-height: 1.08;
      letter-spacing: 0;
    }

    .brand-logo {
      display: block;
      width: min(260px, 72vw);
      height: auto;
      margin: 0 0 14px;
    }

    .brand p {
      margin: 7px 0 0;
      color: var(--muted);
      font-size: 0.98rem;
    }

    .summary {
      min-width: 168px;
      padding: 10px 12px;
      border: 1px solid var(--border);
      border-radius: 8px;
      background: var(--panel);
      box-shadow: 0 8px 20px rgba(17, 24, 39, 0.05);
      text-align: right;
    }

    .summary strong {
      display: block;
      font-size: 1.15rem;
    }

    .summary span {
      color: var(--muted);
      font-size: 0.82rem;
    }

    .actions {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      margin: 0 0 30px;
    }

    .bottom-actions {
      margin: 0 0 16px;
    }

    .top-actions {
      justify-content: flex-end;
    }

    .utility-button {
      min-height: 42px;
      padding: 0 14px;
      border: 1px solid var(--border);
      border-radius: 8px;
      background: var(--panel);
      color: var(--text);
      cursor: pointer;
      font-weight: 700;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }

    .utility-button.primary {
      border-color: var(--accent);
      background: var(--accent);
      color: #fff;
    }

    .utility-button.danger {
      border-color: var(--no);
      background: var(--no);
      color: #fff;
    }

    .utility-button.whatsapp {
      border-color: #1fa855;
      background: #1fa855;
      color: #fff;
    }

    .button-icon {
      width: 20px;
      height: 20px;
      flex: 0 0 auto;
    }

    .section {
      margin: 0 0 38px;
    }

    .section-head {
      display: flex;
      align-items: end;
      justify-content: space-between;
      gap: 16px;
      margin: 0 0 14px;
      padding-bottom: 10px;
      border-bottom: 1px solid var(--border);
    }

    .section h2 {
      margin: 0;
      font-size: 1.25rem;
      text-transform: capitalize;
    }

    .section-count {
      color: var(--muted);
      font-size: 0.92rem;
      white-space: nowrap;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 16px;
    }

    .card {
      overflow: hidden;
      border: 1px solid var(--border);
      border-radius: 8px;
      background: var(--panel);
      box-shadow: var(--shadow);
    }

    .video-wrap {
      background: #101217;
      aspect-ratio: 9 / 16;
    }

    video {
      display: block;
      width: 100%;
      height: 100%;
      object-fit: contain;
      background: #101217;
    }

    .card-body {
      padding: 12px;
    }

    .video-title {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin: 0 0 10px;
      font-weight: 800;
    }

    .status {
      display: none;
      flex: 0 0 auto;
      padding: 3px 8px;
      border-radius: 999px;
      color: var(--muted);
      background: #eef1f5;
      font-size: 0.76rem;
      font-weight: 800;
      text-transform: uppercase;
    }

    .card[data-choice="ok"] .status {
      display: inline-flex;
      color: var(--ok);
      background: var(--ok-soft);
    }

    .card[data-choice="no"] .status {
      display: inline-flex;
      color: var(--no);
      background: var(--no-soft);
    }

    .choice-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
    }

    .choice {
      min-height: 42px;
      border: 1px solid var(--border);
      border-radius: 8px;
      background: #fff;
      color: var(--text);
      cursor: pointer;
      font-weight: 800;
    }

    .choice.ok {
      color: var(--ok);
    }

    .choice.no {
      color: var(--no);
    }

    .card[data-choice="ok"] .choice.ok {
      border-color: var(--ok);
      background: var(--ok-soft);
    }

    .card[data-choice="no"] .choice.no {
      border-color: var(--no);
      background: var(--no-soft);
    }

    .toast {
      position: fixed;
      right: 18px;
      bottom: 18px;
      max-width: min(360px, calc(100% - 36px));
      padding: 12px 14px;
      border-radius: 8px;
      color: #fff;
      background: #171a1f;
      box-shadow: var(--shadow);
      transform: translateY(120%);
      transition: transform 180ms ease;
    }

    .toast.show {
      transform: translateY(0);
    }

    @media (max-width: 920px) {
      .grid {
        grid-template-columns: repeat(2, minmax(0, 1fr));
      }
    }

    @media (max-width: 640px) {
      .page {
        width: min(100% - 22px, 1180px);
        padding-top: 16px;
      }

      .topbar {
        margin: 0 -11px 18px;
        padding: 12px 11px;
      }

      .topbar-inner {
        align-items: stretch;
        flex-direction: column;
      }

      .summary {
        text-align: left;
      }

      .actions {
        display: grid;
        grid-template-columns: 1fr;
      }

      .grid {
        grid-template-columns: 1fr;
      }

      .section-head {
        align-items: start;
        flex-direction: column;
        gap: 4px;
      }
    }
  </style>
</head>
<body>
  <main class="page">
    <header class="topbar">
      <div class="topbar-inner">
        <div class="brand">
          <img class="brand-logo" src="https://www.tuttobatterie.com/media/logo/default/logo.png" alt="Tuttobatterie">
          <h1>Selezione video AI</h1>
          <p>Seleziona i video che ritieni più corretti e invia il riepilogo direttamente a Pietro via WhatsApp o via email. I dati vengono salvati direttamente nel tuo browser.</p>
        </div>
        <div class="summary" aria-live="polite">
          <strong id="summary-count">0/0</strong>
          <span>video valutati</span>
        </div>
      </div>
    </header>

    <div class="actions top-actions">
      <button class="utility-button danger" id="reset-choices" type="button">Azzera scelte</button>
    </div>

    <div id="sections"></div>

    <section class="section" aria-labelledby="summary-title">
      <div class="section-head">
        <h2 id="summary-title">Riepilogo</h2>
        <span class="section-count">Scegli come inviare</span>
      </div>
      <div class="actions bottom-actions">
        <button class="utility-button whatsapp" id="send-whatsapp" type="button">
          <svg class="button-icon" viewBox="0 0 24 24" aria-hidden="true">
            <path fill="currentColor" d="M12.04 2C6.55 2 2.08 6.35 2.08 11.7c0 1.7.46 3.36 1.34 4.82L2 22l5.65-1.38a10.2 10.2 0 0 0 4.39.99c5.49 0 9.96-4.35 9.96-9.7S17.53 2 12.04 2Zm0 17.86a8.5 8.5 0 0 1-4.1-1.04l-.3-.17-3.34.82.85-3.22-.2-.32a7.77 7.77 0 0 1-1.18-4.08c0-4.38 3.71-7.95 8.27-7.95s8.27 3.57 8.27 7.95-3.71 8.01-8.27 8.01Zm4.54-5.96c-.25-.12-1.47-.71-1.7-.79-.23-.08-.4-.12-.57.12-.17.24-.65.79-.8.95-.15.16-.29.18-.54.06-.25-.12-1.05-.38-2-1.2-.74-.65-1.24-1.45-1.39-1.69-.14-.24-.01-.37.11-.49.11-.11.25-.29.37-.43.12-.14.16-.24.25-.4.08-.16.04-.3-.02-.43-.06-.12-.57-1.33-.78-1.83-.21-.48-.42-.42-.57-.43h-.49c-.17 0-.43.06-.66.3-.23.24-.87.83-.87 2.02 0 1.19.89 2.34 1.02 2.5.12.16 1.76 2.6 4.26 3.65.6.25 1.06.4 1.42.52.6.19 1.14.16 1.57.1.48-.07 1.47-.59 1.68-1.15.21-.57.21-1.05.15-1.15-.06-.1-.23-.16-.48-.28Z"/>
          </svg>
          Manda a Pietro via WhatsApp
        </button>
        <button class="utility-button primary" id="send-email" type="button">
          <svg class="button-icon" viewBox="0 0 24 24" aria-hidden="true">
            <path fill="currentColor" d="M4 5h16a2 2 0 0 1 2 2v10a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V7a2 2 0 0 1 2-2Zm0 3.2v8.8h16V8.2l-7.36 5.16a1.1 1.1 0 0 1-1.28 0L4 8.2Zm.86-1.2L12 12.01 19.14 7H4.86Z"/>
          </svg>
          Manda a Pietro via email
        </button>
      </div>
    </section>
  </main>

  <div id="toast" class="toast" role="status" aria-live="polite"></div>

  <script>
    const storageKey = "tuttobatterie-video-scelte-v1";

    const groups = [
      {
        title: "Motobat",
        codePrefix: "MOT",
        videos: [
          "motobat/ UCG_Batteria per MOTO di Motobatt comprata su Tuttobatterie.com. Una batteria con uno spunto superiore alle classiche batterie con acido. Senza manutenzione, nessuna perdita di acido e con la possibiltà di essere montata in qualsiasi posizione_#1(1).mp4",
          "motobat/ UCG_Batteria per MOTO di Motobatt comprata su Tuttobatterie.com. Una batteria con uno spunto superiore alle classiche batterie con acido. Senza manutenzione, nessuna perdita di acido e con la possibiltà di essere montata in qualsiasi posizione_#2.mp4",
          "motobat/ UCG_Batteria per MOTO di Motobatt comprata su Tuttobatterie.com. Una batteria con uno spunto superiore alle classiche batterie con acido. Senza manutenzione, nessuna perdita di acido e con la possibiltà di essere montata in qualsiasi posizione_#1.mp4"
        ]
      },
      {
        title: "NBA ermetica",
        codePrefix: "NBAE",
        videos: [
          "nba-ermetica/ UCG_BATTERIA per pannelli sloari NBA ERMETICA AL GEL 52L3GEL presa su Tuttobatterie(1).com_#1.mp4",
          "nba-ermetica/ UCG_BATTERIA per pannelli sloari NBA ERMETICA AL GEL 52L3GEL presa su Tuttobatterie(1).com_#3.mp4",
          "nba-ermetica/ 2_OK_UCG_BATTERIA NBA PISTRA TUBOLARE per mezzi per LAVASCIUGA presa su Tuttobatterie.com_#1.mp4",
          "nba-ermetica/1_OK_ UCG_Batteria NBA piastra tubolare corazzata per transpallet. Comprata su tuttobatterie.com_#3.mp4"
        ]
      },
      {
        title: "Vesna",
        codePrefix: "VES",
        videos: [
          "vesna/video_6a295a6826e0819194c106db691afa9e0c834812a6f29f0d_video.mp4",
          "vesna/ UCG_Batteria Avviamento Vesna AGM per Auto presa su Tuttobatterie.com_#3.mp4",
          " UCG_Batteria Avviamento Vesna AGM per Auto presa su Tuttobatterie(1).com_#1.mp4"
        ]
      },
      {
        title: "NBA piana",
        codePrefix: "NBAP",
        videos: [
          "nba-piana/ UCG_La batterie NBA piastra piana comprata su TUTTOBATTERIE.COM si caratterizza per maneggevolezza, peso ridotto, facile manutenzione, alta capacità e lunga durata._#2.mp4"
        ]
      }
    ];

    const state = loadChoices();
    const sections = document.querySelector("#sections");
    const summaryCount = document.querySelector("#summary-count");
    const toast = document.querySelector("#toast");

    function videoId(groupIndex, videoIndex) {
      return `${groups[groupIndex].title} - Video ${videoIndex + 1}`;
    }

    function videoCode(groupIndex, videoIndex) {
      return `${groups[groupIndex].codePrefix}-${String(videoIndex + 1).padStart(2, "0")}`;
    }

    function encodePath(path) {
      return path.split("/").map(encodeURIComponent).join("/");
    }

    function loadChoices() {
      try {
        return JSON.parse(localStorage.getItem(storageKey)) || {};
      } catch {
        return {};
      }
    }

    function saveChoices() {
      localStorage.setItem(storageKey, JSON.stringify(state));
    }

    function setChoice(id, choice) {
      state[id] = choice;
      saveChoices();
      refresh();
    }

    function render() {
      sections.innerHTML = groups.map((group, groupIndex) => {
        const cards = group.videos.map((path, videoIndex) => {
          const id = videoId(groupIndex, videoIndex);
          const code = videoCode(groupIndex, videoIndex);
          const choice = state[id] || "";
          const status = choice === "ok" ? "OK" : choice === "no" ? "Non OK" : "";

          return `
            <article class="card" data-id="${id}" data-choice="${choice}">
              <div class="video-wrap">
                <video src="${encodePath(path)}" controls preload="metadata" playsinline></video>
              </div>
              <div class="card-body">
                <p class="video-title">
                  <span>Video ${videoIndex + 1} · ${code}</span>
                  <span class="status">${status}</span>
                </p>
                <div class="choice-row" aria-label="Scelta per ${id}">
                  <button class="choice ok" type="button" data-action="ok" data-id="${id}">OK</button>
                  <button class="choice no" type="button" data-action="no" data-id="${id}">Non OK</button>
                </div>
              </div>
            </article>
          `;
        }).join("");

        return `
          <section class="section">
            <div class="section-head">
              <h2>${group.title}</h2>
              <span class="section-count">${group.videos.length} video</span>
            </div>
            <div class="grid">${cards}</div>
          </section>
        `;
      }).join("");
    }

    function toBoldUnicode(text) {
      const normal = "ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789";
      const bold = "𝐀𝐁𝐂𝐃𝐄𝐅𝐆𝐇𝐈𝐉𝐊𝐋𝐌𝐍𝐎𝐏𝐐𝐑𝐒𝐓𝐔𝐕𝐖𝐗𝐘𝐙𝐚𝐛𝐜𝐝𝐞𝐟𝐠𝐡𝐢𝐣𝐤𝐥𝐦𝐧𝐨𝐩𝐪𝐫𝐬𝐭𝐮𝐯𝐰𝐱𝐲𝐳𝟎𝟏𝟐𝟑𝟒𝟓𝟔𝟕𝟖𝟗";

      return [...text].map((char) => {
        const index = normal.indexOf(char);
        return index >= 0 ? bold[index] : char;
      }).join("");
    }

    function formatBold(text, format) {
      if (format === "whatsapp") return `*${text}*`;
      if (format === "email") return toBoldUnicode(text);
      return text;
    }

    function buildSummary(format = "plain") {
      const lines = [formatBold("Selezione video AI - Tuttobatterie", format), ""];

      groups.forEach((group, groupIndex) => {
        const groupLines = [];
        group.videos.forEach((path, videoIndex) => {
          const id = videoId(groupIndex, videoIndex);
          const code = videoCode(groupIndex, videoIndex);
          const choice = state[id] === "ok" ? "OK" : state[id] === "no" ? "NON OK" : "";
          if (!choice) return;
          const videoTitle = formatBold(`Video ${videoIndex + 1} (${code})`, format);
          const formattedChoice = formatBold(choice, format);
          groupLines.push(`- ${videoTitle}: ${formattedChoice}`);
        });
        if (!groupLines.length) return;
        lines.push(formatBold(group.title, format));
        lines.push(...groupLines, "");
      });

      if (lines.length === 2) {
        lines.push("Nessun video selezionato.");
      }

      return lines.join("\n").trim();
    }

    function refresh() {
      const total = groups.reduce((sum, group) => sum + group.videos.length, 0);
      const selected = Object.values(state).filter(Boolean).length;

      document.querySelectorAll(".card").forEach((card) => {
        const id = card.dataset.id;
        const choice = state[id] || "";
        const status = card.querySelector(".status");
        card.dataset.choice = choice;
        status.textContent = choice === "ok" ? "OK" : choice === "no" ? "Non OK" : "";
      });

      summaryCount.textContent = `${selected}/${total}`;
    }

    function showToast(message) {
      toast.textContent = message;
      toast.classList.add("show");
      window.clearTimeout(showToast.timer);
      showToast.timer = window.setTimeout(() => toast.classList.remove("show"), 2200);
    }

    sections.addEventListener("click", (event) => {
      const button = event.target.closest("[data-action]");
      if (!button) return;
      setChoice(button.dataset.id, button.dataset.action);
    });

    document.querySelector("#send-whatsapp").addEventListener("click", () => {
      const message = buildSummary("whatsapp");
      const url = `https://wa.me/393281198301?text=${encodeURIComponent(message)}`;
      window.open(url, "_blank", "noopener,noreferrer");
    });

    document.querySelector("#send-email").addEventListener("click", () => {
      const subject = "Selezione video AI - Tuttobatterie";
      const body = buildSummary("email");
      window.location.href = `mailto:pietro.malerba@justhex.com?subject=${encodeURIComponent(subject)}&body=${encodeURIComponent(body)}`;
    });

    document.querySelector("#reset-choices").addEventListener("click", () => {
      if (!confirm("Vuoi azzerare tutte le scelte salvate?")) return;
      Object.keys(state).forEach((key) => delete state[key]);
      saveChoices();
      refresh();
      showToast("Scelte azzerate.");
    });

    render();
    refresh();
  </script>
</body>
</html>
